<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ff5fa2">
<title>💌</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%92%97</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    font-family:"Quicksand",-apple-system,system-ui,sans-serif;
    background:#ffd9e8; color:#5e1133; overflow:hidden;
    min-height:100dvh; display:grid; place-items:center;
  }
  .display{ font-family:"Fredoka",sans-serif; }
  .hand{ font-family:"Caveat",cursive; }

  /* ---------- app shell (mobile-first, phone frame on desktop) ---------- */
  #app{
    position:relative; width:100vw; height:100dvh; overflow:hidden; background:#ffe3ef;
    touch-action:none; user-select:none;
  }
  @media (min-width:540px){
    body{ background:radial-gradient(130% 120% at 50% 0%, #ffb3d9 0%, #ff8fc7 45%, #d6176b 100%); }
    #app{ width:430px; height:min(920px,94dvh); border-radius:46px; overflow:hidden;
          box-shadow:0 40px 110px -25px rgba(150,10,70,.65), 0 0 0 11px #2a0a1c, 0 0 0 13px #4a1330;
          touch-action:auto; }
    #gate{ border-radius:46px; }
  }

  /* ---------- scenes ---------- */
  #stage{ position:absolute; inset:0; }
  .scene{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:safe center; text-align:center;
    gap:13px; padding:64px 24px 92px; overflow-y:auto; overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    background:var(--bg); color:var(--fg,#5e1133);
    opacity:0; visibility:hidden; transform:scale(1.02);
    transition:opacity .5s ease, transform .5s ease;
  }
  @media (max-width:520px){
    .scene{ gap:11px; padding:58px 18px 84px; }
    .opt{ font-size:16px !important; padding:13px 15px !important; }
  }
  .scene.active{ opacity:1; visibility:visible; transform:none; }
  .scene .bgwrap{ position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
  .scene > *:not(.bgwrap){ position:relative; z-index:1; max-width:380px; width:100%; }

  .eyebrow{ font-size:13px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; opacity:.72; }
  .headline{ font-size:clamp(26px,7.4vw,32px); font-weight:700; line-height:1.12; }
  .big{ font-size:clamp(38px,12vw,56px); font-weight:700; line-height:1.04; }
  .huge{ font-size:clamp(72px,24vw,128px); font-weight:700; line-height:.9; letter-spacing:-.02em; }
  .sub{ font-size:clamp(15px,4.3vw,18px); font-weight:600; line-height:1.45; opacity:.92; }
  .tiny{ font-size:12.5px; font-weight:700; opacity:.6; letter-spacing:.03em; }
  .accent{ color:var(--accent,#ff177d); }
  .unit{ font-size:.4em; font-weight:700; opacity:.8; }

  /* entrance pop */
  .scene.active .rise{ animation:rise .6s cubic-bezier(.2,.7,.2,1) both; }
  .scene.active .rise:nth-child(2){animation-delay:.05s}.scene.active .rise:nth-child(3){animation-delay:.11s}
  .scene.active .rise:nth-child(4){animation-delay:.17s}.scene.active .rise:nth-child(5){animation-delay:.23s}
  .scene.active .rise:nth-child(6){animation-delay:.29s}.scene.active .rise:nth-child(7){animation-delay:.35s}
  @keyframes rise{ from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:none} }
  .scene.active .pop{ animation:pop .7s cubic-bezier(.18,.9,.3,1.4) both; animation-delay:.1s; }
  @keyframes pop{ from{opacity:0;transform:scale(.5)} to{opacity:1;transform:scale(1)} }

  /* progress */
  #bar{ position:absolute; top:0; left:0; right:0; height:6px; background:rgba(255,255,255,.4); z-index:40; }
  #bar > i{ display:block; height:100%; width:0; border-radius:0 6px 6px 0;
            background:linear-gradient(90deg,#ff177d,#ff7eb3); transition:width .5s ease; }
  #counter{ position:absolute; top:14px; right:18px; z-index:40; font-size:12px; font-weight:700;
            color:#fff; opacity:.85; background:rgba(214,23,107,.35); padding:3px 10px; border-radius:20px;
            backdrop-filter:blur(4px); }

  /* hint + nav */
  .hint{ position:absolute; bottom:30px; left:0; right:0; text-align:center; z-index:30;
         font-size:13.5px; font-weight:700; opacity:.7; animation:bob 1.7s ease-in-out infinite; }
  @keyframes bob{0%,100%{transform:translateY(0);opacity:.55}50%{transform:translateY(-5px);opacity:.85}}
  .navhint{ position:absolute; bottom:0; width:46%; top:60px; z-index:5; }

  /* buttons / pills */
  .btn{ font-family:"Fredoka",sans-serif; font-weight:600; font-size:18px; border:none; cursor:pointer;
        background:#fff; color:#ff177d; padding:15px 22px; border-radius:30px; width:100%;
        box-shadow:0 8px 22px -6px rgba(150,10,70,.4); transition:transform .12s ease, box-shadow .2s; }
  .btn:active{ transform:scale(.96); }
  .btn.ghost{ background:rgba(255,255,255,.22); color:var(--fg,#fff); box-shadow:none;
              border:2px solid rgba(255,255,255,.55); }

  /* quiz options */
  .opts{ display:flex; flex-direction:column; gap:11px; width:100%; margin-top:6px; }
  .opt{ font-family:"Quicksand",sans-serif; font-weight:700; font-size:17px; cursor:pointer;
        background:rgba(255,255,255,.9); color:#7a1840; padding:15px 18px; border-radius:20px;
        border:2.5px solid transparent; text-align:left; transition:transform .12s, background .2s, border-color .2s;
        display:flex; align-items:center; gap:10px; }
  .opt:active{ transform:scale(.97); }
  .opt.correct{ background:#34c759; color:#fff; border-color:#fff; }
  .opt.wrong{ background:#ff5b7e; color:#fff; border-color:#fff; }
  .opt.dim{ opacity:.5; }
  .opt .mk{ margin-left:auto; font-size:20px; }
  .result{ margin-top:14px; font-weight:700; font-size:16px; line-height:1.4; min-height:0;
           opacity:0; transform:translateY(8px); transition:.4s; }
  .result.show{ opacity:1; transform:none; }

  /* slider guess */
  .slider{ width:100%; -webkit-appearance:none; appearance:none; height:14px; border-radius:10px;
           background:rgba(255,255,255,.55); outline:none; margin:10px 0; }
  .slider::-webkit-slider-thumb{ -webkit-appearance:none; width:34px; height:34px; border-radius:50%;
           background:#fff; box-shadow:0 4px 12px rgba(150,10,70,.5); cursor:pointer; border:3px solid #ff177d; }
  .slider::-moz-range-thumb{ width:34px; height:34px; border-radius:50%; background:#fff; border:3px solid #ff177d; cursor:pointer; }
  .gval{ font-family:"Fredoka",sans-serif; font-weight:700; font-size:clamp(40px,13vw,60px); }

  /* chips / charts */
  .splitbar{ width:100%; height:50px; border-radius:16px; overflow:hidden; display:flex; }
  .splitbar > div{ display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px;
                   width:0; transition:width 1.1s cubic-bezier(.2,.7,.2,1); white-space:nowrap; font-family:"Fredoka",sans-serif;}
  .row{ display:flex; gap:12px; width:100%; }
  .col{ flex:1; } .label{ font-size:13px; font-weight:700; opacity:.78; margin-bottom:3px; }
  .emojirow{ display:flex; flex-wrap:wrap; gap:10px 16px; justify-content:center; font-size:34px; }
  .emojirow span{ display:inline-flex; flex-direction:column; align-items:center; line-height:1; }
  .emojirow small{ font-size:12px; font-weight:700; opacity:.8; margin-top:5px; font-family:"Quicksand"; }
  .chart{ display:flex; align-items:flex-end; gap:4px; width:100%; height:130px; }
  .chart .bar{ flex:1; background:rgba(255,255,255,.45); border-radius:5px 5px 0 0; height:0;
               transition:height .9s cubic-bezier(.2,.7,.2,1); }
  .chart .bar.hot{ background:#fff; }
  .chartlabels{ display:flex; justify-content:space-between; width:100%; font-size:10px; font-weight:700; opacity:.7; margin-top:6px; }
  .tiles{ display:flex; flex-direction:column; gap:11px; width:100%; }
  .tile{ background:rgba(255,255,255,.85); border-radius:18px; padding:14px 16px; display:flex; align-items:baseline; gap:10px; text-align:left; color:#7a1840; }
  .tile b{ font-family:"Fredoka"; font-size:28px; } .tile span{ font-size:13.5px; font-weight:700; }

  .names{ font-family:"Fredoka"; font-size:clamp(40px,12vw,58px); font-weight:700; line-height:1.0; }
  .hb{ display:inline-block; animation:hb 1.3s ease-in-out infinite; } @keyframes hb{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}

  /* floaties */
  .floaty{ position:absolute; will-change:transform; }
  @keyframes floatUp{ 0%{transform:translateY(30px) scale(.7);opacity:0}15%{opacity:.85}100%{transform:translateY(-115dvh) scale(1.1);opacity:0} }
  @keyframes confetti{ 0%{transform:translateY(-10%) rotate(0);opacity:0}10%{opacity:1}100%{transform:translateY(115dvh) rotate(380deg);opacity:0} }

  /* ---------- gate ---------- */
  #gate{ position:absolute; inset:0; z-index:100; display:flex; flex-direction:column;
         align-items:center; justify-content:center; gap:16px; padding:34px 28px; text-align:center;
         background:radial-gradient(120% 120% at 50% 10%, #ff9ec7 0%, #ff5fa2 55%, #d6176b 100%); color:#fff; }
  #gate .lockheart{ font-size:64px; animation:hb 1.4s ease-in-out infinite; }
  #gate input{ font-family:"Fredoka"; font-size:24px; text-align:center; width:100%; max-width:280px;
        padding:14px 16px; border-radius:18px; border:none; outline:none; color:#7a1840;
        letter-spacing:.12em; box-shadow:0 10px 26px -8px rgba(120,0,50,.5); }
  #gate input.shake{ animation:shake .45s; }
  @keyframes shake{ 0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)} }
  #gate .gmsg{ min-height:20px; font-weight:700; font-size:14.5px; opacity:.95; }
  #gate.hidden{ opacity:0; visibility:hidden; transition:opacity .6s ease; }

  .lovemeter{ width:100%; height:26px; border-radius:16px; background:rgba(255,255,255,.4); overflow:hidden; }
  .lovemeter > i{ display:block; height:100%; width:0; background:linear-gradient(90deg,#fff,#ffd1e8); }
</style>
</head>
<body>
<div id="app">
  <div id="bar"><i></i></div>
  <div id="counter"></div>
  <div id="stage"></div>
  <div class="hint" id="hint">tap to continue 🩷</div>

  <div id="gate">
    <div class="lockheart">💌</div>
    <div class="display" style="font-size:30px;font-weight:700">a little something 🩷</div>
    <div class="sub" style="max-width:300px">made with love.<br>pick the date to unlock it 🔒</div>
    <input id="gpass" type="text" inputmode="numeric" autocomplete="off" placeholder="MM / DD / YY" />
    <button class="btn" id="gbtn" style="max-width:280px">unlock 💗</button>
    <div class="gmsg" id="gmsg">hint: our anniversary 🩷 &nbsp;·&nbsp; type it like MM / DD / YY</div>
  </div>
</div>

/* ---------- decrypt (everything ships as ciphertext; her date is the key) ---------- */
function b64ToBuf(b){ const s=atob(b),u=new Uint8Array(s.length); for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i); return u; }
async function decryptPayload(pw){
  const salt=b64ToBuf(ENC.s), iv=b64ToBuf(ENC.i), ct=b64ToBuf(ENC.c);
  const base=await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:ENC.it, hash:"SHA-256"}, base,
    {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM", iv}, key, ct);
  return JSON.parse(new TextDecoder().decode(pt));
}

/* ====================== engine ====================== */
const stage=document.getElementById("stage"), bar=document.querySelector("#bar i"),
      counter=document.getElementById("counter"), hintEl=document.getElementById("hint");
let cur=0, nodes=[], answered={}, score=0, total=SCENES.length;

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=(i*7+3)%(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function renderScene(s,idx){
  const d=document.createElement("div"); d.className="scene"; const th=TH[s.th];
  d.style.setProperty("--bg",th.bg); d.style.setProperty("--fg",th.fg); d.style.setProperty("--accent",th.accent);
  if(s.type==='slide'){ d.innerHTML=s.html; }
  else if(s.type==='quiz'){ d.innerHTML=quizHTML(s.qz,s.n); }
  else if(s.type==='guess'){ d.innerHTML=guessHTML(s.g,s.n); }
  else if(s.type==='score'){ d.dataset.dyn='score'; d.innerHTML=`<div class="bgwrap" data-f="🩷✨"></div><div class="eyebrow rise">${FAYE}'s score</div><div class="huge rise" id="scoreNum">0</div><div class="big rise accent" id="scoreOf">out of ${QUIZ.length}</div><div class="sub rise" id="scoreMsg"></div><div class="tiny rise">tap for one last thing →</div>`; }
  else if(s.type==='finale'){ d.innerHTML=`<div class="bgwrap" id="confetti"></div>
     <div class="eyebrow rise">made with love, from ${ME} 🩷</div>
     <div class="hand rise" style="font-size:clamp(29px,8.2vw,38px);line-height:1.2">${fmt(T.messages)} texts later,<br>${ME} is still<br>obsessed with ${FAYE}.</div>
     <div class="sub rise">here's to ${FAYE} &amp; ${ME}, and the next ${fmt(T.messages)} 🩷</div>
     <div class="rise" style="width:100%;margin-top:6px"><div class="lovemeter"><i id="lm"></i></div>
       <div class="tiny" style="margin-top:8px" id="lmh">tap the heart 👇</div></div>
     <button class="btn rise" id="loveBtn" style="margin-top:8px">🩷 tap the heart 🩷</button>
     <button class="btn ghost rise" id="replay" style="margin-top:4px">replay from the top ↺</button>`; }
  return d;
}
function quizHTML(qz,n){
  const opts=shuffle(qz.opts.map((o,i)=>({t:o[0],ok:o[1],i})));
  return `<div class="eyebrow rise">question ${n} of ${QUIZ.length} ${qz.e}</div>
    <div class="headline rise">${qz.q}</div>
    <div class="opts rise">`+opts.map(o=>`<button class="opt" data-ok="${o.ok}"><span>${o.t}</span><span class="mk"></span></button>`).join("")+`</div>
    <div class="result" data-ok="${qz.ok}" data-no="${qz.no}"></div>
    <button class="btn rise nextbtn" style="display:none;margin-top:14px">next 🩷</button>`;
}
function guessHTML(g,n){
  const mid=Math.round((g.min+g.max)/2/g.step)*g.step;
  return `<div class="eyebrow rise">guess ${n} ${g.e}</div>
    <div class="headline rise">${g.q}</div>
    <div class="gval rise" id="gv">${fmt(mid)}</div>
    <input class="slider rise" type="range" min="${g.min}" max="${g.max}" step="${g.step}" value="${mid}" id="gs">
    <button class="btn rise lockbtn" style="margin-top:8px">lock it in 💗</button>
    <div class="result"></div>
    <button class="btn rise nextbtn" style="display:none;margin-top:12px">next 🩷</button>`;
}

/* floaties */
function floaties(node){ const w=node.querySelector(".bgwrap[data-f]"); if(!w||w.dataset.done)return; w.dataset.done=1;
  const set=[...w.dataset.f]; for(let i=0;i<16;i++){ const f=document.createElement("div"); f.className="floaty";
    f.textContent=set[i%set.length]; f.style.left=(Math.random()*100)+"%"; f.style.fontSize=(18+Math.random()*28)+"px";
    f.style.animation=`floatUp ${5+Math.random()*5}s linear ${Math.random()*5}s infinite`; w.appendChild(f);} }
function confetti(node){ const w=node.querySelector("#confetti"); if(!w||w.dataset.done)return; w.dataset.done=1;
  const set=["🩷","❤️","💕","✨","💖","🎀","💗"]; for(let i=0;i<70;i++){ const f=document.createElement("div"); f.className="floaty";
    f.textContent=set[i%set.length]; f.style.left=(Math.random()*100)+"%"; f.style.fontSize=(16+Math.random()*26)+"px";
    f.style.animation=`confetti ${3+Math.random()*3}s linear ${Math.random()*2.5}s infinite`; w.appendChild(f);} }
function counts(node){ node.querySelectorAll("[data-c]").forEach(el=>{ const tg=+el.dataset.c,t0=performance.now();
  (function step(now){ const p=Math.min(1,(now-t0)/1150),e=1-Math.pow(1-p,3); el.textContent=fmt(tg*e);
    if(p<1)requestAnimationFrame(step); else el.textContent=fmt(tg);})(t0); }); }
function reveal(node){ node.querySelectorAll(".chart .bar").forEach(b=>requestAnimationFrame(()=>b.style.height=b.dataset.h+"%"));
  const sp=node.querySelector("#split"); if(sp)sp.querySelectorAll("div").forEach(x=>requestAnimationFrame(()=>x.style.width=x.dataset.w+"%")); }

function go(i){
  if(i<0||i>=total) return;
  if(i>cur && !canAdvance()) { nudge(); return; }
  nodes[cur].classList.remove("active"); cur=i;
  const node=nodes[cur], s=SCENES[cur];
  node.classList.add("active");
  bar.style.width=((cur+1)/total*100)+"%";
  counter.textContent=(cur+1)+" / "+total;
  counts(node); reveal(node); floaties(node);
  if(s.type==='score') showScore(node);
  if(s.type==='finale'){ confetti(node); }
  hintEl.style.display = (s.type==='slide' || (s.type==='score')) ? "" : "none";
  if((s.type==='quiz'||s.type==='guess') && answered[cur]) hintEl.style.display="";
}
function canAdvance(){ const s=SCENES[cur]; if(s.type==='quiz'||s.type==='guess') return !!answered[cur]; return true; }
function nudge(){ hintEl.textContent="pick an answer first 😊"; hintEl.style.display=""; setTimeout(()=>{hintEl.textContent="tap to continue 🩷";},1400); }

function showScore(node){
  const num=node.querySelector("#scoreNum"), msg=node.querySelector("#scoreMsg");
  let n=0; const t0=performance.now(),tg=score;
  (function step(now){ const p=Math.min(1,(now-t0)/900); num.textContent=Math.round(tg*p);
    if(p<1)requestAnimationFrame(step); else num.textContent=tg; })();
  const r = score>=8?`${FAYE} knows ${ME} by heart 💍 soulmate behavior.`
          : score>=6?`${FAYE} really pays attention 🥰 so sweet.`
          : score>=4?`a lovely score 💗 and now ${FAYE} knows even more.`
          : score>=2?`${FAYE} just learned a bunch of new things 🥰 that was the whole point.`
          : `every answer was a brand new little fact to keep 💗 ${ME} loves ${FAYE}.`;
  msg.innerHTML=r;
}

/* ---------- interactions ---------- */
stage.addEventListener("click",e=>{
  const opt=e.target.closest(".opt");
  if(opt && !opt.closest(".scene").dataset.locked){
    const sc=opt.closest(".scene"); sc.dataset.locked=1;
    const ok=opt.dataset.ok==="1";
    sc.querySelectorAll(".opt").forEach(o=>{ o.classList.add("dim");
      if(o.dataset.ok==="1"){o.classList.remove("dim");o.classList.add("correct");o.querySelector(".mk").textContent="✓";} });
    if(!ok){ opt.classList.remove("dim"); opt.classList.add("wrong"); opt.querySelector(".mk").textContent="✗"; }
    if(ok) score++;
    const res=sc.querySelector(".result"); res.innerHTML=ok?("yes! "+res.dataset.ok):res.dataset.no; res.classList.add("show");
    answered[cur]=1; const nb=sc.querySelector(".nextbtn"); if(nb)nb.style.display="";
    if(ok) burstHearts();
    return;
  }
  if(e.target.closest(".lockbtn")){
    const sc=e.target.closest(".scene"); sc.dataset.locked=1;
    const g=SCENES[cur].g, val=+sc.querySelector("#gs").value;
    const res=sc.querySelector(".result"); res.innerHTML=g.rev(val); res.classList.add("show");
    sc.querySelector(".lockbtn").style.display="none";
    sc.querySelector("#gs").disabled=true;
    answered[cur]=1; sc.querySelector(".nextbtn").style.display=""; burstHearts(); return;
  }
  if(e.target.closest(".nextbtn")){ go(cur+1); return; }
  if(e.target.closest("#replay")){ score=0; answered={};
    nodes.forEach(n=>{n.dataset.locked="";}); rebuild(); go(0); return; }
  if(e.target.closest("#gs")||e.target.closest(".slider")) return;
  if(e.target.closest("#loveBtn")){ fillLove(); return; }
});
stage.addEventListener("input",e=>{ if(e.target.id==="gs"){ const sc=e.target.closest(".scene"); sc.querySelector("#gv").textContent=fmt(+e.target.value);} });

/* love meter: one tap fills it all the way (works on touch + mouse) */
function fillLove(){
  const lm=document.querySelector("#lm"), h=document.querySelector("#lmh");
  if(!lm || lm.dataset.run) return; lm.dataset.run=1;
  lm.style.transition="width 0.9s cubic-bezier(.2,.7,.2,1)";
  void lm.offsetWidth;            // reflow so the transition takes effect
  lm.style.width="100%";
  setTimeout(()=>{ if(h) h.innerHTML="∞ &nbsp;·&nbsp; that's how much 🩷"; burstHearts(); burstHearts(); }, 950);
}

function burstHearts(){ const node=nodes[cur]; const set=["🩷","💕","✨","💖"]; for(let i=0;i<14;i++){ const f=document.createElement("div");
  f.className="floaty"; f.textContent=set[i%4]; f.style.left=(20+Math.random()*60)+"%"; f.style.bottom="40%"; f.style.fontSize=(18+Math.random()*20)+"px";
  f.style.animation=`floatUp ${1.6+Math.random()*1.4}s ease-out forwards`; node.appendChild(f); setTimeout(()=>f.remove(),3200); } }

/* swipe + tap-zones for passive slides */
let dx0=0,dy0=0,dt0=0,moved=false;
stage.addEventListener("pointerdown",e=>{ dx0=e.clientX;dy0=e.clientY;dt0=performance.now();moved=false; },{passive:true});
stage.addEventListener("pointermove",e=>{ if(Math.abs(e.clientX-dx0)>12||Math.abs(e.clientY-dy0)>12)moved=true; },{passive:true});
stage.addEventListener("pointerup",e=>{
  const dx=e.clientX-dx0, dt=performance.now()-dt0;
  if(Math.abs(dx)>55 && Math.abs(dx)>Math.abs(e.clientY-dy0)){ dx<0?go(cur+1):go(cur-1); return; }
  if(dt<240 && !moved){
    const s=SCENES[cur];
    if(s.type==='slide'||s.type==='score'||s.type==='finale'){
      if(e.target.closest("button")) return;
      const r=stage.getBoundingClientRect();
      (e.clientX-r.left) < r.width*0.34 ? go(cur-1) : go(cur+1);
    }
  }
});
document.addEventListener("keydown",e=>{ if(e.key==="ArrowRight"||e.key===" ")go(cur+1); else if(e.key==="ArrowLeft")go(cur-1); });

/* build + gate */
function rebuild(){ stage.innerHTML=""; nodes=[]; SCENES.forEach((s,i)=>{ const n=renderScene(s,i); stage.appendChild(n); nodes.push(n); }); }
function start(){ rebuild(); go(0); }

// turn whatever date format she types into MMDDYY candidates. the real date is NEVER in this file;
// AES-GCM's auth tag is what confirms the right one.
const MONTHS={january:'01',february:'02',march:'03',april:'04',may:'05',june:'06',july:'07',august:'08',september:'09',october:'10',november:'11',december:'12',jan:'01',feb:'02',mar:'03',apr:'04',jun:'06',jul:'07',aug:'08',sept:'09',sep:'09',oct:'10',nov:'11',dec:'12'};
function rawToDigits(s){
  s=(s||"").toLowerCase();
  for(const name of Object.keys(MONTHS)){ if(s.indexOf(name)>=0){ s=s.replace(name," "+MONTHS[name]+" "); break; } }
  return s.replace(/\D/g,"");
}
function candidates(d){
  const c=new Set(), add=x=>{ if(x&&x.length===6) c.add(x); };
  if(d.length===6){ add(d); add(d.slice(2,4)+d.slice(0,2)+d.slice(4,6)); add(d.slice(2,4)+d.slice(4,6)+d.slice(0,2)); }
  if(d.length===8){ add(d.slice(0,4)+d.slice(6,8)); add(d.slice(2,4)+d.slice(0,2)+d.slice(6,8)); add(d.slice(4,6)+d.slice(6,8)+d.slice(2,4)); }
  add(d.slice(0,6));
  if(c.size===0 && d) c.add(d);
  return [...c];
}
async function tryUnlock(){
  if(busy) return;
  const digits=rawToDigits(gpass.value);
  if(digits.length<6){ fail(); return; }
  busy=true; gmsg.textContent="unlocking… 💗";
  for(const cand of candidates(digits)){
    try{
      DATA = await decryptPayload(cand);     // throws if the date is wrong
      buildContent(); start();
      gate.classList.add("hidden"); setTimeout(()=>gate.style.display="none",650);
      return;
    }catch(e){ /* wrong candidate, keep trying */ }
  }
  busy=false; fail();
}
function fail(){
  tries++; gpass.classList.add("shake"); setTimeout(()=>gpass.classList.remove("shake"),460);
  gmsg.innerHTML = tries>=3 ? "the date that started us 🩷 · type it MM/DD/YY"
    : tries>=2 ? "hmm 🥺 think… <i>our</i> date · MM/DD/YY"
    : "that's not it 🥺 try again · MM/DD/YY";
}
gbtn.addEventListener("click",tryUnlock);
gpass.addEventListener("keydown",e=>{ if(e.key==="Enter")tryUnlock(); });
setTimeout(()=>{ try{ gpass.focus(); }catch(e){} },400);
</script>
